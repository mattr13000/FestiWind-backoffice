
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Details - FestiWind</title>
<link rel="stylesheet" href="../css/workshop-details.css">
<script src="../js/workshop-details.js" defer></script>
</head>

<body>
  <main class="container">

    <h1 id="workshop-title">Workshop Details</h1>

    <article class="workshop-card">

      <section id="workshop-info">
      </section>

      <section class="workshop-actions">
        <button id="delete-button" type="button">
          Delete
        </button>

        <button id="update-button" type="button">
          Update
        </button>
      </section>

    </article>
<section id="update-section" hidden>
  <h2>Update Workshop</h2>

  <form id="update-form">
    <label for="update-name">Name</label>
    <input type="text" id="update-name" required>

    <label for="update-description">Description</label>
    <textarea id="update-description" required></textarea>

    <label for="update-start">Start time</label>
    <input type="datetime-local" id="update-start" required>

    <label for="update-end">End time</label>
    <input type="datetime-local" id="update-end" required>

    <label for="update-capacity">Maximum capacity</label>
    <input type="number" id="update-capacity" min="1" required>

    <button type="submit">Save changes</button>
    <button type="button" id="cancel-update">Cancel</button>
  </form>
</section>

    <p id="message" role="status"></p>

  </main>
</body>
</html>
