<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="../css/add-workshop.css">

    <script src="../js/workshopForm.js" defer></script>

    <title>Add Workshop</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/nav-bar.css">
    <script src="../js/navbar.js" defer></script>
</head>

<body>
    <header id="shared-navbar" class="bg-navbar"></header>
    <main class="add-workshop-main">

        <div class="add-workshop-header">
            <h1>Add Workshop</h1>
        </div>

        <form id="add-workshop-form" class="workshop-form">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    minlength="3"
                    maxlength="100"
                    placeholder="Workshop name"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="categories">Category</label>
                    <select id="categories" name="categories" required>
                        <option value="" disabled selected>
                            Choose a category ...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="max-capacity">Max capacity</label>
                    <input
                        type="number"
                        id="max-capacity"
                        name="max-capacity"
                        min="1"
                        step="1"
                        placeholder="15"
                        required
                    >
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start-time">Start time</label>
                    <input
                        type="datetime-local"
                        id="start-time"
                        name="start-time"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="end-time">End time</label>
                    <input
                        type="datetime-local"
                        id="end-time"
                        name="end-time"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    minlength="3"
                    placeholder="Describe your workshop..."
                    required
                ></textarea>
            </div>

            <p id="form-message" class="form-message" role="status" aria-live="polite" hidden></p>

            <div class="form-actions">
                <button type="submit" id="submit">
                    Create workshop
                </button>
            </div>

        </form>

    </main>
</body>
</html>
