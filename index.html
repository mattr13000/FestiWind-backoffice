<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/main.js" defer></script>
    <title>Festiwind</title>
</head>
<body>
     <header class="bg-navbar">
        <div class="container dflex ai-c gap-24">
            <div>
                <a href="index.html">
                <img class="logo" src="assets/images/logo-festiwind.svg" alt="Return to workshops page">
                </a>
            </div>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html" class="color-w nav-btn">Workshops</a></li>
                    <li><a href="view/reservation.html" class="color-w nav-btn">Reservations</a></li>
                </ul>
            </nav>
             <div class="logout">
                <button type="button">
                <img class="logo-logout" src="assets/images/logo-logout.svg" alt="Logout">
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h1 class="title">Festi Wind</h1>

            <div class="login-card">
                <form action="" method="POST">

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="E-mail" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>

                </form>
            </div>
        </div>
    </main>
</body>
</html>
