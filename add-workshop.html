<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style src="style.css"></style>
    <script src="js/main.js" defer></script>
    <title>Add Workshop</title>
</head>
<body>
    <header>
        <h1>Add Workshop
        </h1>
    </header>

    <fieldset>
        <legend>Register</legend>
            <label for="username">Username</label>
            <br>
            <input type=text id="usernameField" name="username" required>
        <br>
        <br>
            <label for="password">Password</label>
            <br>
            <input type=password id="passwordField" name="password" required>
        <br>
        <br>
            <label for="email">E-Mail</label>
            <br>
            <input type=email id="emailField" name="email" required>
        <br>
        <br>
            <label for="gender">Gender</label>
            <br>
            <label for="genderF">F</label>
        
            <input type=radio id="genderf" name="genderM" checked>
            <label for="genderM">M</label>
        
            <input type=radio id="genderm" name="genderF">
        <br>
        <br>
            <button type="submit">Submit</button>
    </fieldset>
</body>
</html>
