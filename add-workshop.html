<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style src="style.css"></style>
    <script src="js/workshopForm.js" defer></script>
    <title>Add Workshop</title>
</head>

<body>
    <header>
        <h1>Add Workshop
        </h1>
    </header>

    <form id="add-workshop-form">
    <fieldset>       
        <label for="name">Name</label>
        <br>
        <input type=text id="" name="name" minlength="3"  maxlength="20" required>
        <br>
        <label for="category">Category</label>
        <br>
        <input type=text id="" name="category" required>
        <br>
        <label for="start-time">Start time</label>
        <br>
        <input type=datetime-local id="" name="start-time" required>
        <br>
        <label for="end-time">End time</label>
        <br>
        <input type=datetime-local id="" name="end-time" required>
        <br>
        <label for="description">Description</label>
        <br>
        <input type=text id="" name="description" minlength="3" maxlength="200" required>
        <br>
        <label for="max-capacity">Max capacity</label>
        <br>
        <input type=number min="0" step="1" id="" name="max-capacity" required>
        <br>
        <button type="submit">Submit</button>
    </fieldset>
    </form>
</body>

</html>
